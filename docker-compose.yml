services:
  comfyui:
    build:
      context: .
      args:
        OMNI_BASE_IMAGE: ${OMNI_BASE_IMAGE:-llm-scaler-omni:0.2.0-b2-comfyui-bmg}
    image: ${COMFYUI_IMAGE:-comfyui-intel-arc:omni-b2}
    container_name: ${COMFYUI_CONTAINER_NAME:-comfyui-omni}
    restart: unless-stopped
    working_dir: /llm/ComfyUI
    shm_size: "64gb"

    # Match Intel's validated BMG launch path.  On multi-GPU hosts, verify
    # xpu:0 is the intended Arc device with ./scripts/validate.sh.
    devices:
      - /dev/dri:/dev/dri

    ports:
      - "${COMFYUI_PORT:-8188}:8188"

    volumes:
      - ${COMFYUI_MODELS_DIR:-./models}:/llm/ComfyUI/models
      - ${COMFYUI_INPUT_DIR:-./input}:/data/input
      - ${COMFYUI_OUTPUT_DIR:-./output}:/data/output
      - ${COMFYUI_USER_DIR:-./user}:/data/user
      - ${COMFYUI_HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface

    command:
      - python
      - main.py
      - --input-directory
      - /data/input
      - --output-directory
      - /data/output
      - --user-directory
      - /data/user
      - --listen
      - 0.0.0.0
      - --enable-manager
